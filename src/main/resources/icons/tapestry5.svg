<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <!-- Tapestry 5 Plugin Icon - represents weaving/tapestry pattern -->
  <defs>
    <linearGradient id="tapestryGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E85D04;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#DC2F02;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="8" cy="8" r="7" fill="url(#tapestryGradient)"/>
  
  <!-- Woven pattern representing Tapestry -->
  <g fill="none" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round">
    <!-- Horizontal threads -->
    <path d="M3 6 L13 6"/>
    <path d="M3 8 L13 8"/>
    <path d="M3 10 L13 10"/>
    
    <!-- Vertical weave pattern -->
    <path d="M5 4 L5 5.5 M5 6.5 L5 7.5 M5 8.5 L5 9.5 M5 10.5 L5 12"/>
    <path d="M8 4 L8 5.5 M8 6.5 L8 7.5 M8 8.5 L8 9.5 M8 10.5 L8 12"/>
    <path d="M11 4 L11 5.5 M11 6.5 L11 7.5 M11 8.5 L11 9.5 M11 10.5 L11 12"/>
  </g>
</svg>
