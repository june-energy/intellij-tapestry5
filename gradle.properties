# Tapestry 5.9 IntelliJ Plugin - Gradle Properties
#
# This file contains project-wide Gradle settings.

# Plugin version
pluginVersion = 1.0.0-SNAPSHOT

# IntelliJ Platform version to target
# See: https://plugins.jetbrains.com/docs/intellij/build-number-ranges.html
platformVersion = 2024.1

# Plugin group and artifact identifiers
pluginGroup = com.juneenergy.intellij.tapestry5
pluginId = com.juneenergy.intellij.tapestry5

# Java settings
javaVersion = 17

# Gradle settings
org.gradle.parallel = true
org.gradle.caching = true
org.gradle.configuration-cache = true

# Kotlin settings for Gradle scripts
kotlin.stdlib.default.dependency = false
